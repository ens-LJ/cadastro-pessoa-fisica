name: CI/CD - Sistema de Cadastro
 
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
 
jobs:
 
  testes:
    name: Testes Unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
 
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
 
      - name: Executar testes unitários
        run: node --test
 
  build-e-publica:
    name: Build e Push da imagem Docker
    needs: testes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Debug (temporário) - checar tamanho dos secrets
        run: |
          echo "Tamanho do username: $(echo -n "${{ secrets.DOCKERHUB_USERNAME }}" | wc -c)"
          echo "Tamanho do token: $(echo -n "${{ secrets.DOCKERHUB_TOKEN }}" | wc -c)"

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cadastro-pf:latest
 
  deploy:
    name: Deploy em produção
    needs: build-e-publica
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH no servidor em nuvem
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            IMG=${{ secrets.DOCKERHUB_USERNAME }}/cadastro-pf
            docker pull $IMG:latest
            docker stop cadastro-pf || true
            docker rm cadastro-pf || true
            docker run -d --name cadastro-pf -p 80:80 $IMG:latest
